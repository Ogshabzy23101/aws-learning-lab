apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler-rolebinding
  namespace: kube-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler-role

subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-sa
    namespace: kube-system